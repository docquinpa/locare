apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicules
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehicules
  template:
    metadata:
      labels:
        app: vehicules
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: vehicules
          image: {{ .Values.vehicules.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.vehicules.port }}
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: vehicules_db
            - name: DB_USER
              value: {{ .Values.postgres.username }}
            - name: DB_PASSWORD
              value: {{ .Values.postgres.password }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "vehicules-service"
---
apiVersion: v1
kind: Service
metadata:
  name: vehicules
spec:
  ports:
    - port: {{ .Values.vehicules.port }}
  selector:
    app: vehicules
