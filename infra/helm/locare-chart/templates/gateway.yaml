apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.gateway.port }}
          env:
            - name: VEHICLES_SERVICE_URL
              value: "http://vehicules:8080/api/vehicules"
            - name: DRIVERS_SERVICE_URL
              value: "http://conducteurs:8081/api/conducteurs"
            - name: LOCATION_SERVICE_URL
              value: "localisation:50051"
            - name: MAINTENANCE_SERVICE_URL
              value: "http://maintenance:8082/api/maintenance"
            - name: ALERTES_SERVICE_URL
              value: "http://alertes:8083/api/alertes"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "grpc://otel-collector:4317"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  ports:
    - port: {{ .Values.gateway.port }}
  selector:
    app: gateway
