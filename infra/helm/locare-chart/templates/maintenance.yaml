apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maintenance
  template:
    metadata:
      labels:
        app: maintenance
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: maintenance
          image: {{ .Values.maintenance.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "maintenance_db"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres_password"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "maintenance-service"
---
apiVersion: v1
kind: Service
metadata:
  name: maintenance
  labels:
    app: maintenance
spec:
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  selector:
    app: maintenance
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: maintenance
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`maintenance.{{ .Values.global.domain }}`)
      kind: Rule
      services:
        - name: maintenance
          port: 8082
  tls:
    certResolver: myresolver
